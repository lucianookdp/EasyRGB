name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Libraries
        run: python app/rgb_controller.py bibliotecas
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Inno Setup (installer)
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build EasyRGB.exe, zip and installer
        run: python tools/build_exe.py
      - name: Self-test of the .exe
        run: dist/EasyRGB/EasyRGB.exe autoteste --sem-hardware
      - uses: actions/upload-artifact@v4
        with:
          name: EasyRGB-windows
          path: |
            dist/EasyRGB-Setup.exe
            dist/EasyRGB-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EasyRGB-Setup.exe
            dist/EasyRGB-windows.zip
          generate_release_notes: true
